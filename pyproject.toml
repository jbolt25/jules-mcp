[project]
name = "jules-mcp"
version = "0.1.0"
description = "MCP bridge between Codex and the Google Jules REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "respx>=0.21,<1",
]

[project.scripts]
jules-mcp = "jules_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jules_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
